spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    # defer-datasource-initialization: true
  sql:
#    init:
#      mode: always
#      data-locations: classpath:db/insert.sql
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
    open-in-view: false
server:
  port: 8080